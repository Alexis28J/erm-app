@if (employee(); as employee) {

<mat-card class="employee-card">

    <!-- DETTAGLI DEL DIPENDENTE (Employee Details) -->
    <mat-card-header>
        <mat-card-title>
            Employee Details
            <mat-icon>assignment_ind</mat-icon>
        </mat-card-title>
    </mat-card-header>


    <mat-card-content>

        <div class="employee-info">

            <!-- Codice del dipendente -->
            <p>
                <strong>Employee Code: </strong>
                {{ employee.employeeCode }}
            </p>


            <!-- Nome (e cognome) del dipendente -->
            <p>
                <strong>Name:</strong>
                {{ employee.name }}
                {{ employee.surname }}
            </p>


            <!-- Email -->
            <p>
                <strong>Email:</strong>
                {{ employee.email }}
            </p>


            <!-- Status -->
            <p>
                <strong>Status:</strong>
                <span class="badge" [class.active]="employee.active" [class.inactive]="!employee.active">
                    {{ employee.active ? 'Active' : 'Inactive' }}
                </span>
            </p>

        </div>

    </mat-card-content>

</mat-card>


<!-- STATISTICHE DEL DIPENDENTE (Employee Statistics) -->
<app-employee-statistics></app-employee-statistics>


<!-- STORICO DELLE RICHIESTE (Request History) -->
<app-employee-request-history></app-employee-request-history>

}


<button mat-raised-button color="accent" routerLink="/hr/employee-list" class="back-btn"
    aria-label="Back to Employee List">
    Back to Employee List
    <mat-icon>arrow_back</mat-icon>
</button>
