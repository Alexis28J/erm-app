<mat-card>

    <mat-card-header>
        <mat-card-title matTooltip="Manages whether a user is active or inactive" matTooltipPosition="right">
            User Management
            <mat-icon>group</mat-icon>
        </mat-card-title>
    </mat-card-header>


    <mat-card-content>

        <table mat-table [dataSource]="users()" class="equal-width-table">

            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef>
                    Name
                </th>

                <td mat-cell *matCellDef="let user">
                    {{user.name}}
                    {{user.surname}}
                </td>

            </ng-container>

            <ng-container matColumnDef="email">

                <th mat-header-cell *matHeaderCellDef>
                    Email
                </th>

                <td mat-cell *matCellDef="let user">
                    {{user.email}}
                </td>

            </ng-container>

            <ng-container matColumnDef="active">

                <th mat-header-cell *matHeaderCellDef matTooltip="Indicates whether the user is active or inactive"
                    matTooltipPosition="above">
                    Active
                </th>

                <td mat-cell *matCellDef="let user">

                    <mat-slide-toggle [checked]="user.active" (change)="toggleUsers(user)"
                        aria-label="Toggle User Active Status">
                    </mat-slide-toggle>

                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

    </mat-card-content>


</mat-card>


<div>
    <button mat-raised-button color="primary" class="back-button" routerLink="/hr/settings"
        aria-label="Back to HR Settings">
        <mat-icon>arrow_back</mat-icon>
        Back to HR Settings
    </button>
</div>
