<mat-card>

    <mat-card-header>
        <mat-card-title
            matTooltip="Manages if a user is active or inactive.&#10;If you prefer, import them from a file."
            matTooltipPosition="right" matTooltipClass="tooltip-multiline">
            User Management
            <mat-icon>group</mat-icon>
        </mat-card-title>

        <button mat-raised-button color="primary" class="excel" (click)="fileInput.click()"
            matTooltip="File must be .xlsx or .xls" matTooltipPosition="left">
            Import
            <mat-icon>upload_file</mat-icon>
        </button>
        <input hidden #fileInput type="file" accept=".xlsx, .xls" (change)="importActiveUsers($event)">
    </mat-card-header>


    <mat-card-content>

        <!-- Campo di ricerca per filtrare gli impiegati -->
        <mat-form-field appearance="outline">
            <mat-label>Search Employee (by name or email)</mat-label>
            <input matInput [formControl]="searchControl"
                aria-label="Write the name or email of the employee to search">
        </mat-form-field>


        <!-- <table mat-table [dataSource]="users()" class="equal-width-table"> -->
        <table mat-table [dataSource]="dataSource" matSort class="equal-width-table">

            <ng-container matColumnDef="employeeCode">

                <th mat-header-cell *matHeaderCellDef mat-sort-header="employeeCode">
                    Employee Code
                </th>

                <td mat-cell *matCellDef="let user">
                    {{user.employeeCode}}
                </td>

            </ng-container>

            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef mat-sort-header="name">
                    Name
                </th>

                <td mat-cell *matCellDef="let user">
                    {{user.name}}
                    {{user.surname}}
                </td>

            </ng-container>

            <ng-container matColumnDef="email">

                <th mat-header-cell *matHeaderCellDef mat-sort-header="email">
                    Email
                </th>

                <td mat-cell *matCellDef="let user">
                    {{user.email}}
                </td>

            </ng-container>

            <ng-container matColumnDef="active">

                <th mat-header-cell *matHeaderCellDef matTooltip="(✓) Active / (−) Inactive" matTooltipPosition="above">
                    Active
                </th>

                <td mat-cell *matCellDef="let user">

                    <mat-slide-toggle [checked]="user.active" (change)="toggleUsers(user)"
                        aria-label="Toggle User Active Status">
                    </mat-slide-toggle>

                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons
            aria-label="Select page"></mat-paginator>

    </mat-card-content>


</mat-card>


<div>
    <button mat-raised-button color="primary" class="back-button" routerLink="/hr/settings"
        aria-label="Back to HR Settings">
        <mat-icon>arrow_back</mat-icon>
        Back to HR Settings
    </button>
</div>
