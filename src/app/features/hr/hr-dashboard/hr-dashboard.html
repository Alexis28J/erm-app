<!-- TOOLBAR DEL DASHBOARD DELL'HR (HEADER) -->
<mat-toolbar color="primary">

    <!-- Logo dell'applicazione -->
    <img src="https://techjobsfair.it/prod/wp-content/uploads/2022/10/DGS_logo.png" alt="ERM Logo" class="app-logo">

    <!-- Separatore -->
    <span class="spacer"></span>

    <!-- Informazioni dell'utente corrente -->
    <span>
        {{currentUser?.name}}
        {{currentUser?.surname}}
        ({{currentUser?.email}})
    </span>

    <!-- Separatore -->
    <span class="spacer"></span>

    <!-- Pulsante di logout -->
    <button mat-button (click)="logout()">
        Logout
    </button>

</mat-toolbar>


<!-- CONTENITORE DEL DASHBOARD DELL'HR -->
<div class="dashboard-container">

    <!-- Scheda principale del dashboard -->
    <mat-card>

        <h1>HR Area</h1>

        <!-- Header della scheda principale -->
        <mat-card-header>

            <mat-card-title>
                Welcome, dear {{currentUser?.name}}
            </mat-card-title>


        </mat-card-header>


        <!-- Contenuto della scheda principale -->
        <mat-card-content>

            <p>
                From this area you will be able to review
                and approve expense reimbursement requests.
                You can manage requests and employees from the actions below.
            </p>

        </mat-card-content>

    </mat-card>


    <!-- CONTENITORE DEI PULSANTI DI AZIONE DEL DASHBOARD -->
    <div class="actions-container">
        <button mat-raised-button color="primary">
            Request List
        </button>

        <button mat-raised-button>
            Employee List
        </button>
    </div>

</div>
