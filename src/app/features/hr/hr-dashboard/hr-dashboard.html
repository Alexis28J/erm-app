<!-- CONTENITORE DEL DASHBOARD DELL'HR -->
<div class="dashboard-container">

    <!-- Scheda principale del dashboard -->
    <mat-card>

        <!-- Titolo dell'area HR -->
        <mat-card-title>
            {{ 'hr.dashboard.title' | translate }}
            <mat-icon>dashboard</mat-icon>
        </mat-card-title>

        <!-- Header della scheda principale -->
        <mat-card-header>
            <mat-card-subtitle>
                {{ 'hr.dashboard.welcome' | translate }} {{currentUser?.name}}
            </mat-card-subtitle>
        </mat-card-header>


        <!-- Contenuto della scheda principale -->
        <mat-card-content>
                <p>{{ 'hr.dashboard.text1' | translate }}</p>
                <p>{{ 'hr.dashboard.text2' | translate }}</p>
                <p>{{ 'hr.dashboard.text3' | translate }}</p>
                <p>{{ 'hr.dashboard.text4' | translate }}</p>
        </mat-card-content>

    </mat-card>


    <!-- CONTENITORE DEI PULSANTI DI AZIONE DEL DASHBOARD -->
    <div class="actions-container">
        <button mat-raised-button color="primary" routerLink="/hr/request-list" aria-label="Request List">
            {{ 'hr.dashboard.requestList' | translate }}
            <mat-icon>list</mat-icon>
        </button>

        <button mat-raised-button color="primary" routerLink="/hr/employee-list" aria-label="Employee List">
            {{ 'hr.dashboard.employeeList' | translate }}
            <mat-icon>people</mat-icon>
        </button>
    </div>

</div>
