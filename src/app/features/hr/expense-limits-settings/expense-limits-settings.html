<mat-card>

    <mat-card-header>
        <mat-card-title matTooltip="Manage expense limits and receipt requirements for each category"
            matTooltipPosition="right">
            Expense Limits
            <mat-icon>price_change</mat-icon>
        </mat-card-title>

        <button mat-raised-button color="primary" class="excel" (click)="fileInput.click()">
            Import Expense Limits
            <mat-icon>upload_file</mat-icon>
        </button>
        <input hidden #fileInput type="file" accept=".xlsx, .xls" (change)="importExpenseLimits($event)">
    </mat-card-header>


    <mat-card-content>

        <form [formGroup]="form">

            <table mat-table [dataSource]="expenseLimits.controls" class="equal-width-table">

                <ng-container matColumnDef="category">

                    <th mat-header-cell *matHeaderCellDef>
                        Category
                    </th>

                    <td mat-cell *matCellDef="let row">
                        {{ row.get('name')?.value }}
                    </td>

                </ng-container>


                <ng-container matColumnDef="maxAmount">

                    <th mat-header-cell *matHeaderCellDef matTooltip="Set the maximum amount for this category"
                        matTooltipPosition="above">
                        Max Amount
                    </th>

                    <td mat-cell *matCellDef="let row">
                        <input matInput type="number" [formControl]="row.get('maxAmount')"
                            aria-label="Set the maximum amount for this category">
                    </td>

                </ng-container>

                <ng-container matColumnDef="receiptRequired">

                    <th mat-header-cell *matHeaderCellDef matTooltip="Check if a receipt is required for this category"
                        matTooltipPosition="above">
                        Receipt Required
                    </th>

                    <td mat-cell *matCellDef="let row">
                        <mat-checkbox [formControl]="row.get('receiptRequired')"
                            aria-label="Check if a receipt is required for this category"></mat-checkbox>
                    </td>

                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns">
                </tr>

            </table>

        </form>

    </mat-card-content>

</mat-card>


<div class="actions">
    <button mat-raised-button color="warn" routerLink="/hr/settings" class="cancel-btn"
        aria-label="Cancel and go back to settings">
        <mat-icon>cancel</mat-icon> Cancel
    </button>

    <button mat-raised-button color="primary" (click)="save()" aria-label="Save the expense limits settings">
        <mat-icon>save</mat-icon> Save</button>
</div>
