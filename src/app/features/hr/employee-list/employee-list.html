<mat-card class="page-card">

    <mat-card-header>
        <mat-card-title>
            Employees
            <mat-icon>people</mat-icon>
        </mat-card-title>
    </mat-card-header>


    <mat-card-content>

        <!-- Campo di ricerca per filtrare gli impiegati -->
        <mat-form-field appearance="outline">
            <mat-label>Search Employee (by name or email)</mat-label>
            <input matInput [formControl]="searchControl"
                aria-label="Write the name or email of the employee to search">
        </mat-form-field>


        <!-- <table mat-table [dataSource]="filteredEmployees()" matSort> -->
        <table mat-table [dataSource]="dataSource" matSort class="equal-width-table">

            <!-- Codice dipendente -->
            <ng-container matColumnDef="employeeCode">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="employeeCode">
                    Code
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.employeeCode }}
                </td>
            </ng-container>


            <!-- Nome (e cognome) -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="name">
                    Name
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.name }}
                    {{ employee.surname }}
                </td>
            </ng-container>


            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="email">
                    Email
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.email }}
                </td>
            </ng-container>


            <!-- Status -->
            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="active">
                    Status
                </th>

                <td mat-cell *matCellDef="let employee">
                    <span class="badge" [class.active]="employee.active" [class.inactive]="!employee.active">
                        {{ employee.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
            </ng-container>


            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    Actions
                </th>

                <td mat-cell *matCellDef="let employee">
                    <button mat-raised-button color="primary" (click)="viewDetails(employee.id)"
                        aria-label="View details of the employee">
                        Details
                        <mat-icon>visibility</mat-icon>
                    </button>
                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons
            aria-label="Select page of employee list"></mat-paginator>
        <!-- ShowFirstLastButtons significa che i pulsanti per andare alla prima e all'ultima pagina saranno visibili -->

    </mat-card-content>

</mat-card>


<!-- PULSANTI DI NAVIGAZIONE -->
<div class="navigation-buttons">
    <button mat-raised-button color="accent" routerLink="/hr/dashboard" aria-label="Back to the Dashboard">
        Back to the Dashboard
        <mat-icon>arrow_back</mat-icon>
    </button>

    <button mat-raised-button color="primary" (click)="exportEmployees()" class="excel"
        aria-label="Export the Employee List">
        Export Employee List
        <mat-icon>
            download
        </mat-icon>
    </button>

    <button mat-raised-button color="accent" routerLink="/hr/request-list" aria-label="See the Request List">
        See the Request List
        <mat-icon>list</mat-icon>
    </button>
</div>
