<mat-card class="page-card">

    <mat-card-header>
        <mat-card-title>
            Employees
            <mat-icon>people</mat-icon>
        </mat-card-title>
    </mat-card-header>


    <mat-card-content>

        <mat-form-field appearance="outline">
            <mat-label>Search Employee</mat-label>
            <input matInput [formControl]="searchControl">
        </mat-form-field>


        <table mat-table [dataSource]="filteredEmployees()">

            <!-- Codice dipendente -->
            <ng-container matColumnDef="employeeCode">
                <th mat-header-cell *matHeaderCellDef>
                    Code
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.employeeCode }}
                </td>
            </ng-container>


            <!-- Nome (e cognome) -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>
                    Name
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.name }}
                    {{ employee.surname }}
                </td>
            </ng-container>


            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>
                    Email
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.email }}
                </td>
            </ng-container>


            <!-- Status -->
            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef>
                    Status
                </th>

                <td mat-cell *matCellDef="let employee">
                    <span class="badge" [class.active]="employee.active" [class.inactive]="!employee.active">
                        {{ employee.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
            </ng-container>


            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    Actions
                </th>

                <td mat-cell *matCellDef="let employee">
                    <button mat-raised-button color="primary" (click)="viewDetails(employee.id)">
                        View Details
                    </button>
                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

    </mat-card-content>

</mat-card>

<!-- Aggiungo un pulsante back -->
<button mat-raised-button color="accent" routerLink="/hr/dashboard" class="back-button">
    Back to the Dashboard
    <mat-icon>arrow_back</mat-icon>
</button>
