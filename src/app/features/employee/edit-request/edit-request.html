<!-- CONTROLLA SE LA RICHIESTA ESISTE -->
@if (request(); as requestData) {

<!-- CONTENITORE PRINCIPALE -->
<div class="page-container">

  <!-- TITOLO DELLA PAGINA -->
  <div class="edit-request-header">

    <mat-card-title>Edit Request</mat-card-title>
    <mat-icon>edit_document</mat-icon>

    @if (formError) {
    <span class="error-message">{{ formError }}</span>
    }

  </div>


  <!---------------------------------------- SEZIONE DI DETTAGLI DELLA RICHIESTA ---------------------------------------->
  <form [formGroup]="requestForm">

    <div class="form-section">

      <app-request-details-card [form]="requestForm" [request]="request()">
      </app-request-details-card>


      <!---------------------------------------- SEZIONE DELLE SPESE ---------------------------------------->
      <app-expense-editor [form]="requestForm" [expenses]="expenses" [expenseProgressData]="expenseProgressData()"
        [expenseCategories]="expenseCategories()" (addExpense)="addExpense()" (removeExpense)="removeExpense($event)"
        (filesSelected)="onFilesSelected(
    $event.event,
    $event.index
  )" (removeAttachment)="removeAttachment(
    $event.expenseIndex,
    $event.attachmentIndex
  )">
      </app-expense-editor>


      <!-------------------------------- SEZIONE DI RIEPILOGO DEL TOTALE RICHIESTO --------------------------------->
      <mat-card>

        <div class="total-section">
          <mat-card-subtitle>
            Total Requested Amount
            <mat-icon>payments</mat-icon>
          </mat-card-subtitle>

          <strong>
            {{ totalRequestedAmount() | number:'1.2-2' }} €
          </strong>
        </div>

        <div class="total-expense-container">

          <div class="expense-grid">

            <app-total-progress-bar [allowedAmount]="totalAllowedAmount()" [requestedAmount]="totalRequestedAmount()">
            </app-total-progress-bar>

          </div>

        </div>

      </mat-card>


      <!-- SEZIONE DEI PULSANTI DI AZIONE -->
      <div class="actions">

        <!-- Pulsante per tornare indietro -->
        <div class="cancel-btn">
          <button mat-stroked-button color="primary" type="button" routerLink="/employee/request-list"
            aria-label="Cancel and go back to request list">
            Cancel
            <mat-icon>cancel</mat-icon>
          </button>
        </div>

        <!-- Pulsante per salvare la richiesta come bozza -->
        <button mat-stroked-button color="primary" type="button" (click)="saveDraft()" class="draft-btn"
          aria-label="Save draft of the request">
          Save Draft
          <mat-icon>save</mat-icon>
        </button>

        <!-- Pulsante per inviare la richiesta -->
        <button mat-raised-button color="accent" type="button" (click)="submitRequest()"
          aria-label="Submit the request">
          Submit Request
          <mat-icon>send</mat-icon>
        </button>

      </div>

    </div>

  </form>

</div>

} @else {

<div class="loading-spinner centered-spinner">
  <mat-spinner></mat-spinner>
</div>

}
