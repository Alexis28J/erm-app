<mat-toolbar color="primary">

    <!-- Logo dell'applicazione -->
    <a routerLink="/employee/dashboard">
        <img src="https://techjobsfair.it/prod/wp-content/uploads/2022/10/DGS_logo.png" alt="ERM Logo" class="app-logo"
            matTooltip="BUILDING THE FUTURE" matTooltipPosition="right">
    </a>

    <!-- Separatore -->
    <span class="spacer"></span>


    <!-- Informazioni dell'utente corrente -->
    <div class="user-info">
        <mat-card-title>
            {{currentUser?.name}}
            {{currentUser?.surname}}
        </mat-card-title>

        <mat-card-subtitle>
            ({{currentUser?.email}})
        </mat-card-subtitle>
    </div>


    <!-- MENU A TENDINA PER SPORTARSI -->
    <button mat-button [matMenuTriggerFor]="userMenu" matTooltip="You can navigate to different sections"
        matTooltipPosition="right" class="arrow-btn">
        <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">

        <button mat-menu-item routerLink="/employee/dashboard" class="menu-item">
            Dashboard
            <mat-icon>dashboard</mat-icon>
        </button>


        <button mat-menu-item routerLink="/employee/request-list" class="menu-item">
            My Requests
            <mat-icon>list</mat-icon>
        </button>


        <button mat-menu-item routerLink="/employee/new-request" class="menu-item">
            New Request
            <mat-icon>add</mat-icon>
        </button>
    </mat-menu>


    <!-- Separatore -->
    <span class="spacer"></span>


    <!-- PULSANTE DI LOGOUT -->
    <button mat-button (click)="logout()" matTooltip="Logout" matTooltipPosition="below">
        <mat-icon>logout</mat-icon>
        Exit
    </button>

</mat-toolbar>
