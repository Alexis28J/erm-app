<div class="datepicker-container">

    <input type="text" placeholder="Select a date" readonly [value]="formattedDate()" (click)="toggleCalendar()">

    @if (isOpen) {

    <div class="calendar">
        <div class="calendar-header">

            <button (click)="goToPreviousMonth()">
                ←
            </button>

            <span>
                {{currentMonthName()}}
                {{viewDate().getFullYear()}}
            </span>

            <button (click)="goToNextMonth()" [disabled]="isNextMonthDisabled()">
                →
            </button>

        </div>

        <div class="calendar-grid">

            @for (day of daysInMonth(); track $index) {
            @if (day) {
            <button type="button" (click)="selectDate(day)">
                {{day.getDate()}}
            </button>
            } @else {
            <div class="empty-day"></div>
            }

            }

        </div>

    </div>

    }

</div>
